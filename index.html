<title>DM Pay</title>
<style>
  :root{--red:#e0161f;--red-d:#8f0f18;--ink:#0c0d10;--ink2:#141718;--line:#2b2d33;--carpet:#a8222f;--green:#3fd24a;--amber:#ffb454;--teal:#44b8c4}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#050506;scroll-behavior:smooth}
  body{color:#fff;font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;min-height:100vh;
       background:radial-gradient(120% 60% at 50% 0,#1a1b20 0,#050506 70%)}
  .app{max-width:520px;margin:0 auto;padding-bottom:0}
  .hero svg{display:block;width:100%;height:auto}
  .panel{position:relative;margin:-2px 14px 0;padding:16px;border-radius:0 0 16px 16px;
         background:linear-gradient(180deg,#17181c,#0e0f12);border:1px solid var(--line);border-top:0;
         box-shadow:0 18px 40px rgba(0,0,0,.65)}
  .panel:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;
         background:linear-gradient(90deg,var(--red-d),var(--red),var(--red-d))}
  input{display:block;width:100%;margin:12px 0 0;padding:15px 16px;border-radius:12px;border:1px solid #2f3138;
        background:#08090b;color:#fff;font:700 22px "Arial Black",Arial,sans-serif;outline:0;
        box-shadow:inset 0 2px 8px rgba(0,0,0,.6)}
  input::placeholder{color:#636773;font:700 16px Arial,sans-serif;letter-spacing:.02em}
  input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(224,22,31,.28),inset 0 2px 8px rgba(0,0,0,.6)}
  #note,#waPhone{font-size:16px}
  #waPhone{margin-top:14px;padding:13px 15px}
  .b{display:block;width:100%;margin:12px 0 0;padding:16px;border:0;border-radius:12px;cursor:pointer;
     font:900 17px "Arial Black",Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#fff;
     background:linear-gradient(180deg,#f2252e,#b30f16);box-shadow:0 8px 22px rgba(224,22,31,.4),inset 0 1px 0 rgba(255,255,255,.28)}
  .b:active{transform:translateY(1px);filter:brightness(.92)}
  .b:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
  .o{background:linear-gradient(180deg,#25272c,#16171a);box-shadow:inset 0 0 0 1px #3a3d44;letter-spacing:.08em}
  .back{margin:0 0 14px;padding:13px;font-size:15px;letter-spacing:.1em}
  .wa{background:linear-gradient(180deg,#2ad65a,#139a3a);box-shadow:0 8px 22px rgba(42,214,90,.28),inset 0 1px 0 rgba(255,255,255,.3)}
  .btn-row{display:flex;gap:10px;margin-top:10px}
  .btn-row .b{margin-top:0;flex:1;padding:13px 10px;font-size:13px;letter-spacing:.06em}
  .wa-o{background:linear-gradient(180deg,#1a3322,#102016);box-shadow:inset 0 0 0 1px #25a84b;color:#8ef5a8}
  #msg{min-height:0;margin-top:10px;color:#ff7a80;font:700 14px Arial,sans-serif;text-align:center}
  #msg:empty{display:none}
  #status{min-height:0;margin-top:10px;color:#8ef5a8;font:700 13px/1.4 Arial,sans-serif;text-align:center}
  #status:empty{display:none}
  #result{margin-top:16px;text-align:center}
  .qr-wrap{position:relative;width:100%;max-width:340px;margin:0 auto}
  canvas{display:block;width:100%;border-radius:14px;background:#fff;
         box-shadow:0 0 0 3px var(--red),0 16px 40px rgba(0,0,0,.7);transition:filter .2s}
  .qr-wrap.expired canvas{filter:blur(7px) grayscale(1) opacity(.45)}
  #expiredMask{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
               gap:12px;padding:20px;border-radius:14px;background:rgba(12,13,16,.78)}
  #expiredMask[hidden]{display:none}
  #expiredMask .ex-title{color:#ff5a61;font:900 22px "Arial Black",Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}
  #expiredMask .ex-sub{color:#d5d7dc;font:700 13px/1.4 Arial,sans-serif}
  #expiredMask button{width:auto;margin:0;padding:12px 20px;font-size:14px}
  #expiryBar{margin:10px auto 0;max-width:340px;padding:8px 12px;border-radius:10px;
             background:#101114;border:1px solid rgba(255,180,84,.35);color:var(--amber);
             font:700 13px Arial,sans-serif;letter-spacing:.03em}
  #expiryBar.exp{border-color:rgba(224,22,31,.65);color:#ff6b72;background:rgba(224,22,31,.12)}

  /* Bottom red-carpet History Transaction button */
  .carpet{margin-top:24px;padding:20px 14px calc(22px + env(safe-area-inset-bottom));
          background:repeating-linear-gradient(45deg,rgba(0,0,0,.16) 0 1.5px,transparent 1.5px 6px),var(--carpet);
          box-shadow:inset 0 12px 18px -8px rgba(0,0,0,.55)}
  .carpet .hist-btn{margin-top:0;background:rgba(12,13,16,.88);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 8px 20px rgba(0,0,0,.45);
                    letter-spacing:.08em;font-size:16px}

  /* Transaction History section (below button, scrolls smoothly into view) */
  #historySection{margin:0 14px 28px;padding:18px 14px 20px;border-radius:0 0 16px 16px;
                  background:linear-gradient(180deg,#15161a,#0c0d10);border:1px solid var(--line);border-top:0}
  #historySection[hidden]{display:none}
  .hist-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .hist-title{font:900 15px "Arial Black",Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#e5e7ec}
  .hist-sub{font:700 12px Arial,sans-serif;color:#8e929c}

  /* 3-tab filter: Paid | Pending | Failed */
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .tab{border:1px solid var(--line);border-radius:12px;padding:10px 6px;background:#0e0f13;cursor:pointer;
       text-align:center;color:#9a9ea6;transition:all .15s}
  .tab .t-lbl{display:block;font:900 12px "Arial Black",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}
  .tab .t-amt{display:block;margin-top:4px;font:700 13px Arial,sans-serif}
  .tab.active-paid{background:rgba(63,210,74,.14);border-color:rgba(63,210,74,.65);color:var(--green)}
  .tab.active-pending{background:rgba(255,180,84,.14);border-color:rgba(255,180,84,.65);color:var(--amber)}
  .tab.active-failed{background:rgba(224,22,31,.16);border-color:rgba(224,22,31,.7);color:#ff6b72}

  .empty-state{padding:22px 12px;text-align:center;color:#7a7e88;font:700 13px Arial,sans-serif;
               border:1px dashed #2b2d33;border-radius:12px}

  .row{margin:10px 0;padding:12px 14px;border-radius:12px;
       background:linear-gradient(180deg,#18191e,#101114);border:1px solid var(--line);border-left:5px solid var(--amber)}
  .row.st-paid{border-left-color:var(--green)}
  .row.st-failed{border-left-color:var(--red)}

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);

      for (var x = 0; x < width; x += 1) {
        gif.setPixel(x, y, getPixel(x, y) );
      }
    }

    var b = byteArrayOutputStream();
    gif.write(b);

    var base64 = base64EncodeOutputStream();
    var bytes = b.toByteArray();
    for (var i = 0; i < bytes.length; i += 1) {
      base64.writeByte(bytes[i]);
    }
    base64.flush();

    return 'data:image/gif;base64,' + base64;
  };

  //---------------------------------------------------------------------
  // returns qrcode function.

  return qrcode;
}();

// multibyte support
!function() {

  qrcode.stringToBytesFuncs['UTF-8'] = function(s) {

          utf8.push(0xc0 | (charcode >> 6),
              0x80 | (charcode & 0x3f));
        }
        else if (charcode < 0xd800 || charcode >= 0xe000) {
          utf8.push(0xe0 | (charcode >> 12),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
        // surrogate pair
        else {
          i++;
          // UTF-16 encodes 0x10000-0x10FFFF by
          // subtracting 0x10000 and splitting the
          // 20 bits of 0x0-0xFFFFF into two halves
          charcode = 0x10000 + (((charcode & 0x3ff)<<10)
            | (str.charCodeAt(i) & 0x3ff));
          utf8.push(0xf0 | (charcode >>18),
              0x80 | ((charcode>>12) & 0x3f),
              0x80 | ((charcode>>6) & 0x3f),

}();

(function (factory) {

</script>
<script>
(function () {
  if (qrcode && qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs["UTF-8"]) {
    qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
  }

  var EXPIRY_MS = 3 * 60 * 60 * 1000; // 3 hours
  var $ = function (id) { return document.getElementById(id); };
  var qrDataUrl = null, qrBlob = null, current = null, isOpen = false;
  var activeTab = "pending"; // "paid" | "pending" | "failed"
  var statusTimer = null, countdownTimer = null;

  // ---------- storage (safe + backward-compatible migration + 30-day auto-prune) ----------
  function normalizeStatus(b) {
    if (b && (b.status === "paid" || b.status === "pending" || b.status === "failed")) return b.status;
    return (b && b.paid) ? "paid" : "pending";
  }
  function load() {
    try {
      var raw = JSON.parse(localStorage.getItem("dm_bills") || "[]");
      if (!Array.isArray(raw)) return [];
      return raw.map(function (b) {
        b.status = normalizeStatus(b);
        return b;
      });
    } catch (e) { return []; }
  }
  function save(list) {
    try {
      var cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
      var pruned = list.filter(function (b) { return b && typeof b.t === "number" && b.t >= cutoff; });
      localStorage.setItem("dm_bills", JSON.stringify(pruned));
    } catch (e) {}
  }
  function dayKey(t) {
    var d = new Date(t);
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }
  function getExpiryTime(bill) {
    return bill ? (bill.exp || (bill.t + EXPIRY_MS)) : 0;
  }
  function isBillExpired(bill) {
    return !bill || Date.now() >= getExpiryTime(bill);
  }
  function fmtTime(ts) {
    return new Date(ts).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
  }
  function fmtDateShort(ts) {
    var d = new Date(ts);
    if (dayKey(ts) === dayKey(Date.now())) return "Today " + fmtTime(ts);
    return d.toLocaleDateString([], {day: "2-digit", month: "short"}) + " " + fmtTime(ts);
  }
  function fmtCountdown(ms) {
    var totalSec = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(totalSec / 3600);
    var m = Math.floor((totalSec % 3600) / 60);
    var s = totalSec % 60;
    var pad = function (x) { return x < 10 ? "0" + x : String(x); };
    return pad(h) + ":" + pad(m) + ":" + pad(s);
  }

  // ---------- formatting + UPI + WhatsApp ----------
  function cleanAmount(v) {
    var s = String(v || "").replace(/,/g, "").trim();
    if (!s) return null;
    var n = Math.round(parseFloat(s) * 100) / 100;
    if (!isFinite(n) || n < 1 || n > 100000) return null;
    return n;
  }
  function cleanPhone(v) {
    var digits = String(v || "").replace(/[^0-9]/g, "");
    if (!digits) return "";
    if (digits.length === 10) return "91" + digits;
    if (digits.length === 11 && digits.charAt(0) === "0") return "91" + digits.slice(1);
    return digits;
  }
  function fmtPlain(n) {
    var r = Math.round(n * 100) / 100;
    return Number.isInteger(r) ? String(r) : r.toFixed(2);
  }
  function fmtInr(n) {
    var r = Math.round(n * 100) / 100;
    try {
      return r.toLocaleString("en-IN", {
        minimumFractionDigits: Number.isInteger(r) ? 0 : 2,
        maximumFractionDigits: 2
      });
    } catch (e) {
      return fmtPlain(r);
    }
  }
  function upiString(bill) {
    var expLabel = "Valid till " + fmtTime(getExpiryTime(bill));
    var tn = bill.note ? (bill.note + " | " + expLabel) : expLabel;
    var tr = "DM" + String(bill.t);
    return "upi://pay?pa=" + encodeURIComponent(UPI_ID).replace(/%40/g, "@") +
           "&pn=" + encodeURIComponent(SHOP_NAME) +
           "&am=" + fmtPlain(bill.amt) + "&cu=INR" +
           "&tr=" + encodeURIComponent(tr) +
           "&tn=" + encodeURIComponent(tn);
  }
  function whatsappCaption(bill) {
    if (!bill) return SHOP_NAME + " - UPI: " + UPI_ID;
    var lines = [
      "*" + SHOP_NAME + "*",
      "Amount: Rs " + fmtInr(bill.amt)
    ];
    if (bill.note) lines.push("Car No.: " + bill.note);
    lines.push("UPI ID: " + UPI_ID);
    lines.push("Valid until: " + fmtTime(getExpiryTime(bill)) + " (3 hrs)");
    lines.push("Pay via GPay / PhonePe / Paytm.");
    return lines.join("\n");
  }
  function buildWhatsAppUrl(bill, rawPhone) {
    var phone = cleanPhone(rawPhone);
    var text = encodeURIComponent(whatsappCaption(bill));
    return phone
      ? "https://wa.me/" + phone + "?text=" + text
      : "https://wa.me/?text=" + text;
  }
  function showStatus(text) {
    var el = $("status");
    if (!el) return;
    el.textContent = text;
    if (statusTimer) clearTimeout(statusTimer);
    if (text) {
      statusTimer = setTimeout(function () { el.textContent = ""; }, 4000);
    }
  }

  // ---------- QR card drawing (synchronous PNG Blob + 3-hour validity footer) ----------
  function hat(ctx, cx, cy, w) {
    var k = w / 100;
    ctx.save(); ctx.translate(cx - 50 * k, cy - 32 * k); ctx.scale(k, k);
    ctx.fillStyle = "#e0161f"; ctx.beginPath(); ctx.ellipse(50, 46, 48, 11, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#f0222b"; ctx.beginPath(); ctx.moveTo(18, 46); ctx.bezierCurveTo(16, 22, 28, 8, 46, 10);
    ctx.quadraticCurveTo(50, 16, 54, 10); ctx.bezierCurveTo(72, 8, 84, 22, 82, 46); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#5c080d"; ctx.beginPath(); ctx.moveTo(19, 44); ctx.lineTo(18.5, 36);
    ctx.quadraticCurveTo(50, 42, 81.5, 36); ctx.lineTo(81, 44); ctx.quadraticCurveTo(50, 50, 19, 44); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function lattice(ctx, y, h, W) {
    ctx.fillStyle = "#e0161f"; ctx.fillRect(0, y, W, h);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.4;
    var s = h / 2;
    for (var x = -s; x < W + s; x += h) {
      ctx.beginPath(); ctx.moveTo(x + s, y + 3); ctx.lineTo(x + h - 3, y + s); ctx.lineTo(x + s, y + h - 3);
      ctx.lineTo(x + 3, y + s); ctx.closePath(); ctx.stroke();
    }
  }
  function dataUrlToBlob(dataUrl) {
    var parts = dataUrl.split(",");
    var bin = atob(parts[1]);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], {type: "image/png"});
  }
  function draw(bill) {
    var qr = qrcode(0, "M");
    qr.addData(upiString(bill));
    qr.make();
    var n = qr.getModuleCount(), cv = $("cv"), ctx = cv.getContext("2d");
    var W = cv.width, H = cv.height;
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);

    var g = ctx.createLinearGradient(0, 0, 0, 146); g.addColorStop(0, "#1b1c20"); g.addColorStop(1, "#0c0d10");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, 146);
    hat(ctx, W / 2, 74, 186);
    lattice(ctx, 146, 26, W);

    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#0c0d10"; ctx.font = "900 82px Arial Black, Arial, sans-serif";
    ctx.fillText("Rs " + fmtInr(bill.amt), W / 2, 264, W - 48);
    if (bill.note) {
      ctx.fillStyle = "#c4121b"; ctx.font = "900 32px Arial Black, Arial, sans-serif";
      ctx.fillText(bill.note, W / 2, 312, W - 48);
    }

    var size = 420, cell = Math.floor(size / n), qs = cell * n, pad = 40;
    var x0 = Math.floor((W - qs) / 2), y0 = 376;
    ctx.strokeStyle = "#e0161f"; ctx.lineWidth = 8;
    ctx.strokeRect(x0 - pad, y0 - pad, qs + pad * 2, qs + pad * 2);
    ctx.fillStyle = "#000";
    for (var r = 0; r < n; r++)
      for (var c = 0; c < n; c++)
        if (qr.isDark(r, c)) ctx.fillRect(x0 + c * cell, y0 + r * cell, cell, cell);

    ctx.fillStyle = "#555962";
    ctx.font = "700 24px Arial, sans-serif";
    ctx.fillText("Valid until " + fmtTime(getExpiryTime(bill)) + " (3 hrs)", W / 2, y0 + qs + pad + 44, W - 48);

    lattice(ctx, H - 52, 52, W);
    qrDataUrl = cv.toDataURL("image/png");
    qrBlob = dataUrlToBlob(qrDataUrl);
  }

  function updateExpiryUI() {
    if (!current || !isOpen) return;
    var rem = getExpiryTime(current) - Date.now();
    var bar = $("expiryBar"), wrap = $("qrWrap"), mask = $("expiredMask");
    var shareBtn = $("share"), waChatBtn = $("waChat"), saveBtn = $("save");
    if (rem <= 0) {
      bar.textContent = "QR EXPIRED (3-hour limit reached)";
      bar.className = "exp";
      wrap.classList.add("expired");
      mask.hidden = false;
      shareBtn.disabled = true;
      waChatBtn.disabled = true;
      saveBtn.disabled = true;
      if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
      renderHistory();
    } else {
      bar.textContent = "Expires in " + fmtCountdown(rem) + "  \u00b7  Valid till " + fmtTime(getExpiryTime(current));
      bar.className = "";
      wrap.classList.remove("expired");
      mask.hidden = true;
      shareBtn.disabled = false;
      waChatBtn.disabled = false;
      saveBtn.disabled = false;
    }
  }

  function openBillQR(bill) {
    current = bill;
    $("msg").textContent = "";
    showStatus("");
    draw(bill);
    $("result").hidden = false;
    if (!isOpen) { try { history.pushState({qr: 1}, ""); } catch (e) {} }
    isOpen = true;
    if (countdownTimer) clearInterval(countdownTimer);
    updateExpiryUI();
    if (!isBillExpired(bill)) {
      countdownTimer = setInterval(updateExpiryUI, 1000);
    }
    $("result").scrollIntoView({behavior: "smooth"});
  }

  // ---------- Transaction History (Paid | Pending | Failed) ----------
  function setBillStatus(id, newStatus) {
    var arr = load();
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].id === id) {
        arr[i].status = newStatus;
        arr[i].paid = (newStatus === "paid");
        break;
      }
    }
    save(arr);
    renderHistory();
  }

  function renderHistory() {
    var all = load();
    var sums = {paid: 0, pending: 0, failed: 0};
    all.forEach(function (b) {
      var st = normalizeStatus(b);
      sums[st] += b.amt;
    });
    $("sumPaid").textContent = "Rs " + fmtInr(sums.paid);
    $("sumPending").textContent = "Rs " + fmtInr(sums.pending);
    $("sumFailed").textContent = "Rs " + fmtInr(sums.failed);
    $("histCount").textContent = all.length + (all.length === 1 ? " total" : " total");

    $("tabPaid").className = "tab" + (activeTab === "paid" ? " active-paid" : "");
    $("tabPending").className = "tab" + (activeTab === "pending" ? " active-pending" : "");
    $("tabFailed").className = "tab" + (activeTab === "failed" ? " active-failed" : "");

    var filtered = all.filter(function (b) { return normalizeStatus(b) === activeTab; }).slice().reverse();
    var box = $("historyList");
    box.textContent = "";

    if (!filtered.length) {
      var emp = document.createElement("div");
      emp.className = "empty-state";
      emp.textContent = "No " + activeTab + " transactions yet.";
      box.appendChild(emp);
      return;
    }

    filtered.forEach(function (b) {
      var st = normalizeStatus(b);
      var row = document.createElement("div");
      row.className = "row st-" + st;

      var top = document.createElement("div");
      top.className = "row-top";
      top.title = "Tap to open QR";
      top.onclick = function () { openBillQR(b); };

      var left = document.createElement("div");
      var a = document.createElement("div");
      a.className = "a";
      a.textContent = "Rs " + fmtInr(b.amt);
      var nn = document.createElement("div");
      nn.className = "n";
      nn.textContent = (b.note ? b.note + "  \u00b7  " : "") + fmtDateShort(b.t);
      left.appendChild(a);
      left.appendChild(nn);

      var badge = document.createElement("span");
      badge.className = "badge " + st;
      badge.textContent = st;
      top.appendChild(left);
      top.appendChild(badge);

      var actions = document.createElement("div");
      actions.className = "row-actions";
      [
        {k: "paid", label: "Paid"},
        {k: "pending", label: "Pending"},
        {k: "failed", label: "Failed"}
      ].forEach(function (opt) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = opt.label;
        if (st === opt.k) btn.className = "on-" + opt.k;
        btn.onclick = function () { setBillStatus(b.id, opt.k); };
        actions.appendChild(btn);
      });

      row.appendChild(top);
      row.appendChild(actions);
      box.appendChild(row);
    });
  }

  $("tabPaid").onclick = function () { activeTab = "paid"; renderHistory(); };
  $("tabPending").onclick = function () { activeTab = "pending"; renderHistory(); };
  $("tabFailed").onclick = function () { activeTab = "failed"; renderHistory(); };

  $("historyBtn").onclick = function () {
    var sec = $("historySection");
    sec.hidden = false;
    renderHistory();
    sec.scrollIntoView({behavior: "smooth", block: "start"});
  };

  // ---------- submit ----------
  function createFreshBill(amount, note) {
    var now = Date.now();
    var bill = {
      id: now + "-" + Math.floor(Math.random() * 10000),
      t: now,
      exp: now + EXPIRY_MS,
      amt: amount,
      note: note,
      status: "pending",
      paid: false
    };
    var arr = load();
    arr.push(bill);
    save(arr);
    renderHistory();
    openBillQR(bill);
  }

  function submitBill() {
    var amount = cleanAmount($("amt").value), note = $("note").value.trim().slice(0, 40);
    if (amount === null) { $("msg").textContent = "Enter an amount between 1 and 1,00,000"; return; }
    var arr = load();
    var last = arr.length ? arr[arr.length - 1] : null;
    if (last && last.amt === amount && last.note === note && (Date.now() - last.t) < 3000) {
      openBillQR(last);
      return;
    }
    createFreshBill(amount, note);
  }
  $("go").onclick = submitBill;
  $("amt").addEventListener("keydown", function (e) { if (e.key === "Enter") submitBill(); });
  $("note").addEventListener("keydown", function (e) { if (e.key === "Enter") submitBill(); });
  $("regenBtn").onclick = function () {
    if (!current) return;
    createFreshBill(current.amt, current.note || "");
  };

  function fileName() {
    var amtPart = current ? fmtPlain(current.amt).replace(/[^0-9.]/g, "") : "bill";
    var notePart = (current && current.note) ? "-" + current.note.replace(/[^a-zA-Z0-9]+/g, "").slice(0, 14) : "";
    return "pay-" + amtPart + notePart + ".png";
  }

  function downloadQr(name) {
    if (!qrDataUrl) return;
    if (window.AndroidBridge && window.AndroidBridge.savePng) {
      window.AndroidBridge.savePng(qrDataUrl, name);
      return;
    }
    var url = null;
    var a = document.createElement("a");
    try {
      if (qrBlob && window.URL && URL.createObjectURL) {
        url = URL.createObjectURL(qrBlob);
        a.href = url;
      } else {
        a.href = qrDataUrl;
      }
    } catch (e) {
      a.href = qrDataUrl;
    }
    a.download = name;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    a.remove();
    if (url) setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 15000);
    showStatus("Downloading " + name + "...");
  }

  function openWhatsAppChat() {
    if (!current || isBillExpired(current)) return;
    var phone = $("waPhone") ? $("waPhone").value : "";
    var waUrl = buildWhatsAppUrl(current, phone);
    if (window.AndroidBridge && window.AndroidBridge.openUrl) {
      window.AndroidBridge.openUrl(waUrl);
      return;
    }
    var w = null;
    try { w = window.open(waUrl, "_blank", "noopener,noreferrer"); } catch (e) { w = null; }
    if (!w) {
      window.location.href = waUrl;
    }
  }

  $("share").onclick = function () {
    if (!current || !qrDataUrl || isBillExpired(current)) return;
    var caption = whatsappCaption(current);
    var name = fileName();
    var phone = cleanPhone($("waPhone") ? $("waPhone").value : "");

    if (window.AndroidBridge && window.AndroidBridge.sharePng) {
      if (phone && window.AndroidBridge.openUrl) {
        window.AndroidBridge.savePng(qrDataUrl, name);
        window.AndroidBridge.openUrl(buildWhatsAppUrl(current, phone));
        showStatus("QR saved & opening WhatsApp chat...");
      } else {
        window.AndroidBridge.sharePng(qrDataUrl, name, caption);
        showStatus("Opening WhatsApp...");
      }
      return;
    }

    if (phone) {
      showStatus("Opening WhatsApp chat...");
      openWhatsAppChat();
      return;
    }

    if (typeof File === "function" && qrBlob && navigator.share) {
      var file = null;
      var canShareFile = false;
      try {
        file = new File([qrBlob], name, {type: "image/png"});
        canShareFile = typeof navigator.canShare === "function" ? navigator.canShare({files: [file]}) : false;
      } catch (e) { canShareFile = false; }

      if (canShareFile) {
        navigator.share({files: [file], title: SHOP_NAME, text: caption})
          .then(function () { showStatus("Shared!"); })
          .catch(function (err) {
            if (err && err.name === "AbortError") return;
            showStatus("Opening WhatsApp...");
            openWhatsAppChat();
          });
        return;
      }
    }

    showStatus("Opening WhatsApp...");
    openWhatsAppChat();
  };

  $("waChat").onclick = function () {
    if (!current || isBillExpired(current)) return;
    showStatus("Opening WhatsApp...");
    openWhatsAppChat();
  };

  $("save").onclick = function () {
    if (!current || !qrDataUrl || isBillExpired(current)) return;
    downloadQr(fileName());
  };

  function closeQR() {
    isOpen = false;
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    $("result").hidden = true;
    $("amt").value = ""; $("note").value = ""; $("msg").textContent = ""; showStatus("");
    if ($("waPhone")) $("waPhone").value = "";
    window.scrollTo({top: 0, behavior: "smooth"});
    try { $("amt").focus({preventScroll: true}); } catch (e) {}
  }
  $("back").onclick = function () {
    if (isOpen && history.state && history.state.qr) history.back(); else closeQR();
  };
  window.addEventListener("popstate", function () { if (isOpen) closeQR(); });
  window.__dmHandleBack = function () {
    if (isOpen) { closeQR(); return true; }
    return false;
  };

  // Attach manifest & service worker only if hosted alongside them on HTTP/HTTPS
  if (location.protocol.indexOf("http") === 0 && window.fetch) {
    fetch("./manifest.json", {method: "HEAD"}).then(function (r) {
      if (r.ok) {
        var lk = document.createElement("link");
        lk.rel = "manifest"; lk.href = "./manifest.json";
        document.head.appendChild(lk);
      }
    }).catch(function () {});
    if ("serviceWorker" in navigator) {
      fetch("./sw.js", {method: "HEAD"}).then(function (r) {
        if (r.ok) navigator.serviceWorker.register("./sw.js").catch(function () {});
      }).catch(function () {});
    }
  }

  renderHistory();
})();
</script>
</body>
</html>
