  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#050506}
  body{color:#fff;font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;min-height:100vh;
       background:radial-gradient(120% 60% at 50% 0,#1a1b20 0,#050506 70%)}
  .app{max-width:520px;margin:0 auto;padding-bottom:0}
  .hero svg{display:block;width:100%;height:auto}
  .panel{position:relative;margin:-2px 14px 0;padding:16px;border-radius:0 0 16px 16px;
         background:linear-gradient(180deg,#17181c,#0e0f12);border:1px solid var(--line);border-top:0;
         box-shadow:0 18px 40px rgba(0,0,0,.65)}
  .panel:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;
         background:linear-gradient(90deg,var(--red-d),var(--red),var(--red-d))}
  input{display:block;width:100%;margin:12px 0 0;padding:15px 16px;border-radius:12px;border:1px solid #2f3138;
        background:#08090b;color:#fff;font:700 22px "Arial Black",Arial,sans-serif;outline:0;
        box-shadow:inset 0 2px 8px rgba(0,0,0,.6)}
  input::placeholder{color:#585b63;font-weight:700}
  input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(224,22,31,.28),inset 0 2px 8px rgba(0,0,0,.6)}
  #note{font-size:17px}
  .b{display:block;width:100%;margin:12px 0 0;padding:16px;border:0;border-radius:12px;cursor:pointer;
     font:900 17px "Arial Black",Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#fff;
     background:linear-gradient(180deg,#f2252e,#b30f16);box-shadow:0 8px 22px rgba(224,22,31,.4),inset 0 1px 0 rgba(255,255,255,.28)}
  .b:active{transform:translateY(1px);filter:brightness(.92)}
  .o{background:linear-gradient(180deg,#25272c,#16171a);box-shadow:inset 0 0 0 1px #3a3d44;letter-spacing:.08em}
  .back{margin:0 0 14px;padding:13px;font-size:15px;letter-spacing:.1em}
  .wa{background:linear-gradient(180deg,#2ad65a,#139a3a);box-shadow:0 8px 22px rgba(42,214,90,.28),inset 0 1px 0 rgba(255,255,255,.3)}
  #msg{min-height:0;margin-top:10px;color:#ff7a80;font:700 14px Arial,sans-serif;text-align:center}
  #msg:empty{display:none}
  #result{margin-top:16px;text-align:center}
  canvas{display:block;width:100%;max-width:340px;margin:0 auto;border-radius:14px;background:#fff;
         box-shadow:0 0 0 3px var(--red),0 16px 40px rgba(0,0,0,.7)}
  .list{margin:22px 14px 0}
  #total{display:flex;gap:10px;margin-bottom:12px}
  #total span{flex:1;text-align:center;padding:12px 8px;border-radius:12px;background:#101114;border:1px solid var(--line);
              font:900 17px "Arial Black",Arial,sans-serif}
  #total .g{color:var(--green);border-color:rgba(63,210,74,.4)}
  #total .w{color:#ffb454;border-color:rgba(255,180,84,.35)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0;padding:12px 14px;border-radius:12px;
       background:linear-gradient(180deg,#17181c,#101114);border:1px solid var(--line);border-left:5px solid #ffb454}
  .row.p{border-left-color:var(--green)}
  .row .a{font:900 20px "Arial Black",Arial,sans-serif}
  .row .n{color:#9a9ea6;font:700 13px Arial,sans-serif;margin-top:3px}
  .row button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font:900 13px "Arial Black",Arial,sans-serif;
              letter-spacing:.06em;text-transform:uppercase;color:#fff;background:linear-gradient(180deg,#f2252e,#b30f16)}
  .row.p button{background:#2a2c31;color:#aaa}
  .carpet{margin-top:28px;padding:22px 14px calc(26px + env(safe-area-inset-bottom));
          background:repeating-linear-gradient(45deg,rgba(0,0,0,.16) 0 1.5px,transparent 1.5px 6px),var(--carpet);
          box-shadow:inset 0 12px 18px -8px rgba(0,0,0,.55)}
  .carpet .b{margin-top:0}
  .carpet .b+.b{margin-top:10px}
  .carpet .o{background:rgba(12,13,16,.82)}
</style>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;

// multibyte support

  qrcode.stringToBytesFuncs['UTF-8'] = function(s) {

</script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var blob = null, current = null, isOpen = false;

  // ---------- storage (safe if blocked) ----------
  function load() { try { return JSON.parse(localStorage.getItem("dm_bills") || "[]"); } catch (e) { return []; } }
  function save(list) { try { localStorage.setItem("dm_bills", JSON.stringify(list)); } catch (e) {} }
  function dayKey(t) { var d = new Date(t); return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }

  // ---------- amount + UPI string ----------
  function cleanAmount(v) {
    var n = Math.round(parseFloat(v) * 100) / 100;
    if (!isFinite(n) || n < 1 || n > 100000) return null;
    return n;
  }
  function upiString(amount, note) {
    var s = "upi://pay?pa=" + encodeURIComponent(UPI_ID).replace(/%40/g, "@") + "&pn=" + encodeURIComponent(SHOP_NAME) +
            "&am=" + String(amount) + "&cu=INR";
    if (note) s += "&tn=" + encodeURIComponent(note);
    return s;
  }

  // ---------- card drawing ----------
  function hat(ctx, cx, cy, w) {
    var k = w / 100;
    ctx.save(); ctx.translate(cx - 50 * k, cy - 32 * k); ctx.scale(k, k);
    ctx.fillStyle = "#e0161f"; ctx.beginPath(); ctx.ellipse(50, 46, 48, 11, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#f0222b"; ctx.beginPath(); ctx.moveTo(18, 46); ctx.bezierCurveTo(16, 22, 28, 8, 46, 10);
    ctx.quadraticCurveTo(50, 16, 54, 10); ctx.bezierCurveTo(72, 8, 84, 22, 82, 46); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#5c080d"; ctx.beginPath(); ctx.moveTo(19, 44); ctx.lineTo(18.5, 36);
    ctx.quadraticCurveTo(50, 42, 81.5, 36); ctx.lineTo(81, 44); ctx.quadraticCurveTo(50, 50, 19, 44); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function lattice(ctx, y, h, W) {
    ctx.fillStyle = "#e0161f"; ctx.fillRect(0, y, W, h);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.4;
    var s = h / 2;
    for (var x = -s; x < W + s; x += h) {
      ctx.beginPath(); ctx.moveTo(x + s, y + 3); ctx.lineTo(x + h - 3, y + s); ctx.lineTo(x + s, y + h - 3);
      ctx.lineTo(x + 3, y + s); ctx.closePath(); ctx.stroke();
    }
  }
  function draw(amount, note) {
    var qr = qrcode(0, "M");
    qr.addData(upiString(amount, note));
    qr.make();
    var n = qr.getModuleCount(), cv = $("cv"), ctx = cv.getContext("2d");
    var W = cv.width, H = cv.height;
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);

    // dark header with logo
    var g = ctx.createLinearGradient(0, 0, 0, 150); g.addColorStop(0, "#1b1c20"); g.addColorStop(1, "#0c0d10");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, 150);
    hat(ctx, W / 2, 76, 190);
    lattice(ctx, 150, 28, W);

    // amount
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#0c0d10"; ctx.font = "900 88px Arial Black, Arial, sans-serif";
    ctx.fillText("Rs " + amount, W / 2, 275);
    if (note) { ctx.fillStyle = "#c4121b"; ctx.font = "900 34px Arial Black, Arial, sans-serif"; ctx.fillText(note, W / 2, 326); }

    // QR with red frame (keeps a white quiet zone)
    var size = 430, cell = Math.floor(size / n), qs = cell * n, pad = 46;
    var x0 = Math.floor((W - qs) / 2), y0 = 396;
    ctx.strokeStyle = "#e0161f"; ctx.lineWidth = 8;
    ctx.strokeRect(x0 - pad, y0 - pad, qs + pad * 2, qs + pad * 2);
    ctx.fillStyle = "#000";
    for (var r = 0; r < n; r++)
      for (var c = 0; c < n; c++)
        if (qr.isDark(r, c)) ctx.fillRect(x0 + c * cell, y0 + r * cell, cell, cell);

    lattice(ctx, H - 56, 56, W);
    blob = null;
    cv.toBlob(function (b) { blob = b; }, "image/png");
  }

  // ---------- today's list ----------
  function fmt(n) { return String(Math.round(n * 100) / 100); }
  function render() {
    var all = load(), today = dayKey(Date.now());
    var list = all.filter(function (b) { return dayKey(b.t) === today; });
    var box = $("today"); box.textContent = "";
    var paidSum = 0, pendSum = 0;
    list.slice().reverse().forEach(function (b) {
      if (b.paid) paidSum += b.amt; else pendSum += b.amt;
      var row = document.createElement("div"); row.className = "row" + (b.paid ? " p" : "");
      var left = document.createElement("div");
      var a = document.createElement("div"); a.className = "a"; a.textContent = "Rs " + fmt(b.amt);
      var nn = document.createElement("div"); nn.className = "n";
      var d = new Date(b.t);
      nn.textContent = (b.note ? b.note + "  \u00b7  " : "") + d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
      left.appendChild(a); left.appendChild(nn);
      var btn = document.createElement("button");
      btn.textContent = b.paid ? "Undo" : "Paid";
      btn.onclick = function () {
        var arr = load();
        for (var i = 0; i < arr.length; i++) if (arr[i].id === b.id) arr[i].paid = !arr[i].paid;
        save(arr); render();
      };
      row.appendChild(left); row.appendChild(btn); box.appendChild(row);
    });
    var tot = $("total"); tot.textContent = "";
    if (list.length) {
      var g = document.createElement("span"); g.className = "g"; g.textContent = "\u2713 Rs " + fmt(paidSum);
      var w = document.createElement("span"); w.className = "w"; w.textContent = "\u23f3 Rs " + fmt(pendSum);
      tot.appendChild(g); tot.appendChild(w);
    }
  }

  // ---------- buttons ----------
  $("go").onclick = function () {
    var amount = cleanAmount($("amt").value), note = $("note").value.trim().slice(0, 40);
    if (amount === null) { $("msg").textContent = "1 - 100000"; return; }
    $("msg").textContent = "";
    draw(amount, note);
    $("result").hidden = false;
    if (!isOpen) { try { history.pushState({qr: 1}, ""); } catch (e) {} }
    isOpen = true;
    current = {id: Date.now() + "-" + Math.floor(Math.random() * 1000), t: Date.now(), amt: amount, note: note, paid: false};
    var a = load(); a.push(current); save(a); render();
    $("result").scrollIntoView({behavior: "smooth"});
  };

  function fileName() { return "pay-" + (current ? current.amt : "bill") + ".png"; }

  $("share").onclick = function () {
    if (!blob) return;
    var file = new File([blob], fileName(), {type: "image/png"});
    if (navigator.canShare && navigator.canShare({files: [file]})) {
      navigator.share({files: [file], text: "Rs " + current.amt + " - " + SHOP_NAME}).catch(function () {});
    } else { $("save").click(); }
  };

  $("save").onclick = function () {
    if (!blob) return;
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = fileName();
    document.body.appendChild(a); a.click(); a.remove();
  };

  $("copyid").onclick = function () {
    var b = $("copyid");
    try { navigator.clipboard.writeText(UPI_ID); b.textContent = UPI_ID; }
    catch (e) { b.textContent = UPI_ID; }
  };

  $("clear").onclick = function () {
    if (!confirm("Clear today's list?")) return;
    var today = dayKey(Date.now());
    save(load().filter(function (b) { return dayKey(b.t) !== today; })); render();
  };

  function closeQR() {
    isOpen = false;
    $("result").hidden = true;
    $("amt").value = ""; $("note").value = ""; $("msg").textContent = "";
    window.scrollTo({top: 0, behavior: "smooth"});
    try { $("amt").focus({preventScroll: true}); } catch (e) {}
  }
  $("back").onclick = function () {
    if (isOpen && history.state && history.state.qr) history.back(); else closeQR();
  };
  window.addEventListener("popstate", function () { if (isOpen) closeQR(); });

  render();
})();
</script>
</body>
</html>
